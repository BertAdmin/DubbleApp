{% extends "base.html" %}
{% block title %}Change Password — Dubble{% endblock %}
{% block content %}
<div class="auth-container">
    <h1>Change Password</h1>
    <p class="subtitle">Rekey your wallet seed</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="old_password">Current password</label>
        <input type="password" id="old_password" name="old_password" required autocomplete="current-password">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" required autocomplete="new-password" minlength="6">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" minlength="6">
        <button type="submit">Change password</button>
    </form>
    <p class="auth-link"><a href="{{ url_for('main.index') }}">Back to bubbles</a></p>
</div>
{% endblock %}
