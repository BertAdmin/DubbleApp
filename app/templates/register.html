{% extends "base.html" %}
{% block title %}Register — Dubble{% endblock %}
{% block content %}
<div class="auth-container">
    <h1>Dubble</h1>
    <p class="subtitle">start blowing bubbles</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" minlength="3">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" minlength="6">
        <button type="submit">Create Account</button>
    </form>
    <p class="auth-link">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div>
{% endblock %}
